<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#03121f">
<title>Fishy Crush</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(140% 90% at 50% -10%, #1a7fb8 0%, #0d4d78 35%, #06283f 70%, #02131f 100%);
    color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;
  }
  /* ---------- underwater ambience ---------- */
  .ray{position:fixed;top:-10vh;width:22vw;height:130vh;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,rgba(160,230,255,.28),rgba(160,230,255,0) 75%);
    transform:skewX(-12deg);filter:blur(18px);animation:ray 9s ease-in-out infinite alternate}
  @keyframes ray{to{opacity:.45;transform:skewX(-7deg) translateX(3vw)}}
  .bubble{position:fixed;bottom:-8vh;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.7),rgba(255,255,255,.06) 60%);
    animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-125vh)}}
  .weed{position:fixed;bottom:0;z-index:0;pointer-events:none;opacity:.5;
    animation:sway 5s ease-in-out infinite alternate;transform-origin:bottom center}
  @keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

  /* ---------- HUD ---------- */
  #hud{width:100%;max-width:520px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px;
    display:flex;align-items:center;gap:10px;z-index:3}
  #cat{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:30px;background:linear-gradient(160deg,#ffb347,#ff7b54);
    border:2px solid rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.4);flex:none}
  #cat.swiping{animation:swipe .4s ease}
  @keyframes swipe{30%{transform:rotate(-28deg) translateX(8px) scale(1.15)}60%{transform:rotate(18deg)}}
  #title{font-size:20px;font-weight:900;letter-spacing:1px;color:#fff;line-height:1;
    text-shadow:0 2px 0 #0a4d78,0 4px 10px rgba(0,0,0,.5)}
  #title small{display:block;font-size:10px;letter-spacing:3px;color:#ffd166;font-weight:700}
  #moves{margin-left:auto;background:linear-gradient(160deg,#ffd166,#ff9f43);color:#3d2400;
    border-radius:14px;padding:6px 12px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.35);flex:none}
  #moves b{font-size:20px;display:block;line-height:1}
  #moves span{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}

  #scorebar{width:100%;max-width:520px;padding:2px 14px 8px;z-index:3}
  #progress{height:16px;border-radius:10px;background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative}
  #fill{height:100%;width:0%;border-radius:10px;transition:width .4s cubic-bezier(.3,1.3,.4,1);
    background:linear-gradient(90deg,#ffd166,#ff9f43,#ff6b9d);
    box-shadow:0 0 12px rgba(255,209,102,.7)}
  #ptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;letter-spacing:.5px;text-shadow:0 1px 2px #000}

  /* ---------- board ---------- */
  #stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;z-index:2;position:relative}
  #board{
    display:grid;gap:5px;padding:10px;border-radius:24px;touch-action:none;
    background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25),inset 0 0 50px rgba(0,30,60,.4)}
  .cell{position:relative;border-radius:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .15s;
    background:linear-gradient(160deg,rgba(120,200,255,.22),rgba(10,60,95,.25));
    box-shadow:inset 0 2px 3px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.2)}
  .cell.sel{transform:scale(1.14);z-index:3;
    box-shadow:0 0 0 3px #ffd166,0 0 22px #ffd166,inset 0 2px 3px rgba(255,255,255,.3)}
  .fish{width:82%;height:82%;animation:bob 3s ease-in-out infinite;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .cell.hint{animation:hint .9s infinite}
  @keyframes hint{50%{transform:scale(.85);filter:brightness(1.7)}}
  .cell.matched{animation:pop .32s forwards}
  @keyframes pop{35%{transform:scale(1.35) rotate(12deg);filter:brightness(1.8)}100%{transform:scale(0) rotate(-10deg)}}

  /* scratch marks inside a cell */
  .scratch{position:absolute;inset:0;pointer-events:none;z-index:5}
  .scratch i{position:absolute;left:14%;width:72%;height:7%;border-radius:4px;
    background:linear-gradient(90deg,transparent,#fff 15%,#ffe 50%,#fff 85%,transparent);
    box-shadow:0 0 8px #fff;transform:rotate(-42deg);opacity:0;animation:claw .26s forwards}
  .scratch i:nth-child(1){top:34%}
  .scratch i:nth-child(2){top:50%;animation-delay:.05s}
  .scratch i:nth-child(3){top:66%;animation-delay:.1s}
  @keyframes claw{0%{opacity:0;transform:rotate(-42deg) scaleX(.1)}35%{opacity:1}
    100%{opacity:0;transform:rotate(-42deg) scaleX(1.25)}}

  /* giant paw flying across the screen */
  #paw{position:fixed;font-size:90px;z-index:60;pointer-events:none;opacity:0;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
  #paw.go{animation:pawfly .5s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes pawfly{
    0%{opacity:0;transform:translate(0,0) rotate(-35deg) scale(.5)}
    12%{opacity:1}
    85%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(20deg) scale(1.2)}}
  /* slash trail across screen */
  #slash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
  #slash.go{animation:slashfade .55s forwards}
  #slash i{position:absolute;height:10px;width:130%;left:-15%;border-radius:6px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 12%,rgba(255,240,200,.95) 88%,transparent);
    box-shadow:0 0 18px #fff}
  @keyframes slashfade{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

  .float{position:fixed;z-index:70;font-weight:900;font-size:22px;color:#ffd166;pointer-events:none;
    text-shadow:0 0 12px rgba(255,160,60,.9),0 3px 4px rgba(0,0,0,.7);animation:floatup 1.1s forwards}
  @keyframes floatup{to{transform:translateY(-80px) scale(1.15);opacity:0}}
  #combo{position:fixed;top:38%;left:50%;transform:translateX(-50%);z-index:70;pointer-events:none;
    font-size:34px;font-weight:900;color:#ff6b9d;opacity:0;letter-spacing:1px;
    text-shadow:0 0 20px rgba(255,107,157,.9),0 4px 6px rgba(0,0,0,.7)}
  #combo.go{animation:combo .9s forwards}
  @keyframes combo{15%{opacity:1;transform:translateX(-50%) scale(1.3)}70%{opacity:1}
    100%{opacity:0;transform:translateX(-50%) scale(.9) translateY(-30px)}}
  .particle{position:fixed;border-radius:50%;z-index:65;pointer-events:none;animation:part .7s forwards}
  @keyframes part{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  /* ---------- modal ---------- */
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;
    background:rgba(2,15,25,.7);backdrop-filter:blur(8px)}
  #msg .card{background:linear-gradient(160deg,#13547a,#06283f);border:1px solid rgba(255,255,255,.3);
    border-radius:26px;padding:30px 28px;text-align:center;max-width:330px;width:86vw;
    box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.2)}
  #msg .big{font-size:56px;margin-bottom:6px}
  #msg h2{color:#ffd166;margin-bottom:8px;font-size:24px}
  #msg p{opacity:.85;font-size:14px;margin-bottom:18px;line-height:1.45}
  #msg button{background:linear-gradient(160deg,#ffd166,#ff9f43);border:none;color:#3d2400;
    font-weight:900;font-size:17px;padding:14px 34px;border-radius:16px;cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.4)}
  #msg button:active{transform:scale(.94)}
</style>
</head>
<body>
<div class="ray" style="left:12%"></div>
<div class="ray" style="left:45%;animation-delay:-4s"></div>
<div class="ray" style="left:75%;animation-delay:-7s"></div>
<div class="weed" style="left:-4vw;font-size:70px">🌿</div>
<div class="weed" style="right:-4vw;font-size:80px;animation-delay:-2s">🌿</div>

<div id="hud">
  <div id="cat">🐱</div>
  <div id="title">FISHY<small>CRUSH</small></div>
  <div id="moves"><b id="mv">25</b><span>movs</span></div>
</div>
<div id="scorebar">
  <div id="progress"><div id="fill"></div><div id="ptext"><span id="sc">0</span> / <span id="tg">500</span> · Nivel <span id="lv">1</span></div></div>
</div>
<div id="stage"><div id="board"></div></div>

<div id="paw">🐾</div>
<div id="slash"><i></i><i></i><i></i></div>
<div id="combo"></div>
<div id="msg"><div class="card">
  <div class="big" id="msg-emoji">🐱</div>
  <h2 id="msg-title">Fishy Crush</h2>
  <p id="msg-text">Ayudá al gato a pescar: deslizá un pescadito sobre su vecino para juntar 3 o más iguales. ¡La garra hace el resto!</p>
  <button id="msg-btn">¡A pescar!</button>
</div></div>

<script>
const COLS=8, ROWS=8;
const FISH=[
  {e:'🐠'},{e:'🐟'},{e:'🐡'},{e:'🦈'},{e:'🐙'},{e:'🦐'},
];
const PCOLORS=['#ff9f43','#4fb3ff','#ffd166','#9aa5b1','#ff6b9d','#ff7b54'];
let grid=[], sel=null, score=0, moves=25, level=1, target=500, busy=false, cell=44;
const board=document.getElementById('board');

/* bubbles */
for(let i=0;i<16;i++){const b=document.createElement('div');b.className='bubble';
  const s=6+Math.random()*30;b.style.width=b.style.height=s+'px';
  b.style.left=Math.random()*100+'vw';
  b.style.animationDuration=(7+Math.random()*10)+'s';
  b.style.animationDelay=-Math.random()*12+'s';document.body.appendChild(b);}

/* audio (tiny synth) */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,type='sine',vol=.15,slide=0){ try{const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(f+slide,a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur);}catch(e){} }
const sfx={
  swap(){tone(300,.12,'triangle',.12,180)},
  pop(){tone(600,.1,'square',.1,300)},
  combo(n){tone(500+n*80,.15,'triangle',.16,400);setTimeout(()=>tone(700+n*80,.2,'triangle',.14,500),70)},
  bad(){tone(180,.15,'sawtooth',.08,-60)},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*110))},
  lose(){tone(300,.5,'sine',.14,-180)},
};

function size(){const w=Math.min(innerWidth-20,500),h=innerHeight*.62;
  cell=Math.floor(Math.min((w-20-(COLS-1)*5)/COLS,(h-20-(ROWS-1)*5)/ROWS));
  board.style.gridTemplateColumns=`repeat(${COLS},${cell}px)`;}
addEventListener('resize',()=>{size();render()});

function rnd(){return Math.floor(Math.random()*FISH.length)}
function init(){grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];
    for(let c=0;c<COLS;c++){let v;do{v=rnd()}while(
      (c>=2&&grid[r][c-1]===v&&grid[r][c-2]===v)||
      (r>=2&&grid[r-1][c]===v&&grid[r-2][c]===v));grid[r][c]=v;}}}

function hud(){
  document.getElementById('sc').textContent=score;
  document.getElementById('tg').textContent=target;
  document.getElementById('lv').textContent=level;
  document.getElementById('mv').textContent=moves;
  document.getElementById('fill').style.width=Math.min(100,score/target*100)+'%';
}

function render(){
  board.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=document.createElement('div');d.className='cell';
    d.dataset.r=r;d.dataset.c=c;d.style.width=d.style.height=cell+'px';
    if(grid[r][c]!=null){
      d.innerHTML=`<svg class="fish" viewBox="0 0 40 40" style="animation-delay:${-(r*COLS+c)*.17}s">
        <text x="20" y="31" font-size="30" text-anchor="middle">${FISH[grid[r][c]].e}</text></svg>`;
    }
    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add('sel');
    board.appendChild(d);
  }
  hud();
}

/* ---- input: tap + drag/swipe ---- */
let down=null,sx=0,sy=0;
board.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  down=[+t.dataset.r,+t.dataset.c];sx=e.clientX;sy=e.clientY;
});
board.addEventListener('pointerup',e=>{
  if(!down)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>18||Math.abs(dy)>18){
    let[r,c]=down,tr=r,tc=c;
    if(Math.abs(dx)>Math.abs(dy))tc+=dx>0?1:-1;else tr+=dy>0?1:-1;
    if(tr>=0&&tr<ROWS&&tc>=0&&tc<COLS){trySwap([r,c],[tr,tc]);}
  }else{
    const r=down[0],c=down[1];
    if(!sel){sel=[r,c];render();}
    else if(sel[0]===r&&sel[1]===c){sel=null;render();}
    else if(Math.abs(sel[0]-r)+Math.abs(sel[1]-c)===1){trySwap(sel,[r,c]);}
    else{sel=[r,c];render();}
  }
  down=null;
});
board.addEventListener('pointercancel',()=>down=null);

function trySwap(a,b){
  if(busy)return;
  const[r1,c1]=a,[r2,c2]=b;
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
  sel=null;
  const m=findMatches();
  if(m.size===0){
    [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
    sfx.bad();render();
    board.classList.add('shake');setTimeout(()=>board.classList.remove('shake'),350);
    return;
  }
  sfx.swap();moves--;
  pawSwipe(a,b);
  render();
  resolve(m);
}

function findMatches(){
  const m=new Set();
  for(let r=0;r<ROWS;r++){let run=1;
    for(let c=1;c<=COLS;c++){
      if(c<COLS&&grid[r][c]!=null&&grid[r][c]===grid[r][c-1])run++;
      else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r+','+k);run=1;}}}
  for(let c=0;c<COLS;c++){let run=1;
    for(let r=1;r<=ROWS;r++){
      if(r<ROWS&&grid[r][c]!=null&&grid[r][c]===grid[r-1][c])run++;
      else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k+','+c);run=1;}}}
  return m;
}

/* ---- effects ---- */
function pawSwipe(a,b){
  const cat=document.getElementById('cat');
  cat.classList.remove('swiping');void cat.offsetWidth;cat.classList.add('swiping');
  const paw=document.getElementById('paw');
  const ra=board.children[a[0]*COLS+a[1]].getBoundingClientRect();
  const rb=board.children[b[0]*COLS+b[1]].getBoundingClientRect();
  paw.style.left=(ra.left-20)+'px';paw.style.top=(ra.top-25)+'px';
  paw.style.setProperty('--dx',(rb.left-ra.left+40)+'px');
  paw.style.setProperty('--dy',(rb.top-ra.top+40)+'px');
  paw.classList.remove('go');void paw.offsetWidth;paw.classList.add('go');
}
function bigSlash(){
  const s=document.getElementById('slash');
  const is=s.querySelectorAll('i');
  const y=board.getBoundingClientRect().top+board.offsetHeight/2;
  is.forEach((el,i)=>{
    el.style.top=(y-40+i*40)+'px';
    el.style.transform=`rotate(${-18-i*4}deg)`;
  });
  s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
}
function floatText(txt,x,y){
  const f=document.createElement('div');f.className='float';
  f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
}
function comboBanner(n){
  const c=document.getElementById('combo');
  c.textContent=`¡COMBO x${n}!`;
  c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
}
function particles(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='particle';
    const s=4+Math.random()*7;
    p.style.width=p.style.height=s+'px';
    p.style.left=x+'px';p.style.top=y+'px';
    p.style.background=color;
    p.style.boxShadow=`0 0 ${s}px ${color}`;
    const ang=Math.random()*Math.PI*2,d=30+Math.random()*60;
    p.style.setProperty('--dx',Math.cos(ang)*d+'px');
    p.style.setProperty('--dy',(Math.sin(ang)*d-30)+'px');
    document.body.appendChild(p);setTimeout(()=>p.remove(),750);
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function resolve(first){
  busy=true;
  let m=first,combo=0;
  while(m.size){
    combo++;
    const pts=m.size*10*combo;
    score+=pts;
    const [ar,ac]=[...m][0].split(',').map(Number);
    const el0=board.children[ar*COLS+ac];
    if(el0){const rc=el0.getBoundingClientRect();
      floatText(`+${pts}`,rc.left,rc.top-14);}
    if(combo>1){comboBanner(combo);sfx.combo(combo);bigSlash();
      document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),350);}
    else sfx.pop();
    for(const k of m){
      const[r,c]=k.split(',').map(Number);
      const el=board.children[r*COLS+c];
      if(el){
        const rc=el.getBoundingClientRect();
        particles(rc.left+rc.width/2,rc.top+rc.height/2,PCOLORS[grid[r][c]]||'#fff',8);
        const s=document.createElement('div');s.className='scratch';
        s.innerHTML='<i></i><i></i><i></i>';el.appendChild(s);
        setTimeout(()=>el.classList.add('matched'),130);
      }
    }
    await sleep(320);
    for(const k of m){const[r,c]=k.split(',').map(Number);grid[r][c]=null;}
    for(let c=0;c<COLS;c++){let w=ROWS-1;
      for(let r=ROWS-1;r>=0;r--)if(grid[r][c]!=null){grid[w][c]=grid[r][c];w--;}
      for(let r=w;r>=0;r--)grid[r][c]=rnd();}
    render();
    await sleep(230);
    m=findMatches();
  }
  busy=false;
  render();
  if(score>=target)end(true);
  else if(moves<=0)end(false);
  else showHint();
}

function showHint(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const[dr,dc]of[[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;
      [grid[r][c],grid[r2][c2]]=[grid[r2][c2],grid[r][c]];
      const ok=findMatches().size>0;
      [grid[r][c],grid[r2][c2]]=[grid[r2][c2],grid[r][c]];
      if(ok){board.children[r*COLS+c]?.classList.add('hint');
        board.children[r2*COLS+c2]?.classList.add('hint');return;}
    }
  }
}

function end(win){
  const m=document.getElementById('msg');
  document.getElementById('msg-emoji').textContent=win?'😻':'😿';
  document.getElementById('msg-title').textContent=win?'¡Nivel superado!':'Sin movimientos';
  document.getElementById('msg-text').textContent=win?
    `¡El gato cenó como un rey! ${score} puntos. El próximo nivel pide más.`:
    `Llegaste a ${score} puntos. El gato sigue con hambre…`;
  document.getElementById('msg-btn').textContent=win?'Siguiente nivel':'Reintentar';
  m.style.display='flex';
  win?sfx.win():sfx.lose();
  document.getElementById('msg-btn').onclick=()=>{
    if(win){level++;target=500*level;}else{level=1;target=500;score=0;}
    moves=25;m.style.display='none';init();render();
  };
}
document.getElementById('msg-btn').onclick=()=>{
  ac(); // unlock audio on first tap
  document.getElementById('msg').style.display='none';init();render();
};
size();init();render();
document.getElementById('msg').style.display='flex';
</script>
</body>
</html>
