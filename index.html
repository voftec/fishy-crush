<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B4F8A">
<title>Fishy Crush</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    background:#1E9BD6 url(assets/bg.jpg) center bottom/cover no-repeat;
    color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;
  }
  /* underwater ambience */
  .bubble{position:fixed;bottom:-8vh;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.75),rgba(255,255,255,.08) 60%);
    animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-125vh)}}

  /* ---------- HUD ---------- */
  #hud{width:100%;max-width:520px;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;
    display:flex;align-items:center;gap:6px;z-index:3}
  #cat{width:min(21vw,96px);flex:none;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  #cat img{width:100%;display:block;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)}
  #cat.swiping{animation:swipe .4s ease}
  @keyframes swipe{30%{transform:rotate(-20deg) scale(1.12)}60%{transform:rotate(12deg)}}
  #title{flex:1;min-width:0;display:flex;justify-content:center}
  #title img{width:100%;max-width:300px;display:block;filter:drop-shadow(0 6px 8px rgba(0,40,90,.45));
    animation:logobob 3.5s ease-in-out infinite}
  @keyframes logobob{50%{transform:translateY(-3px) rotate(-1deg)}}
  #moves{flex:none;width:min(21vw,94px);aspect-ratio:1;border-radius:24%;color:#fff;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#FF8FC0 0%,#FF4F97 55%,#E8307A 100%);
    border:4px solid #FFD2E6;
    box-shadow:0 5px 0 #B0195A,0 9px 14px rgba(0,0,0,.35),inset 0 4px 0 rgba(255,255,255,.45),inset 0 -5px 8px rgba(160,0,70,.35)}
  #moves b{font-family:"Arial Rounded MT Bold","Arial Black",system-ui,sans-serif;font-size:min(9vw,40px);line-height:.9;font-weight:900;
    text-shadow:0 3px 0 #9A0F4C,0 0 2px #9A0F4C}
  #moves span{font-family:"Arial Black",system-ui,sans-serif;font-size:min(3.6vw,15px);font-weight:900;letter-spacing:.5px;
    text-transform:uppercase;text-shadow:0 2px 0 #9A0F4C}

  #scorebar{width:100%;max-width:440px;padding:14px 34px 10px 22px;z-index:3}
  #progress{height:30px;border-radius:16px;position:relative;
    background:linear-gradient(180deg,#0E5FA8,#1478C8);
    border:4px solid #FFF1D6;
    box-shadow:0 0 0 2px #E8B26A,0 5px 10px rgba(0,0,0,.3),inset 0 3px 6px rgba(0,0,0,.35)}
  #fill{position:absolute;left:2px;top:2px;bottom:2px;width:0%;max-width:calc(100% - 4px);border-radius:11px;
    transition:width .5s cubic-bezier(.3,1.3,.4,1);
    background:linear-gradient(180deg,#9BF0FF 0%,#38C8F5 50%,#1AA4E6 100%);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.7),0 0 10px rgba(120,230,255,.8)}
  #ptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-left:12px;
    font-family:"Arial Black",system-ui,sans-serif;font-size:13px;font-weight:900;letter-spacing:.5px;color:#fff;
    text-shadow:0 2px 0 #08467E,0 0 3px #08467E}
  #stars{position:absolute;inset:0;pointer-events:none}
  .star{position:absolute;top:50%;width:28px;transform:translate(-50%,-50%);filter:grayscale(1) brightness(.75) opacity(.75)}
  .star#st0{left:62%}.star#st1{left:80%}
  .star#st2{left:100%;width:58px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));animation:starwob 2.4s ease-in-out infinite}
  .star.on{filter:drop-shadow(0 0 8px #FFE14D);animation:starpop .45s cubic-bezier(.3,1.6,.5,1)}
  .star#st2.on{filter:drop-shadow(0 0 12px #FFE14D) drop-shadow(0 4px 4px rgba(0,0,0,.35))}
  @keyframes starpop{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.5)}}
  @keyframes starwob{50%{transform:translate(-50%,-50%) rotate(12deg) scale(1.08)}}

  /* ---------- board ---------- */
  #stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;z-index:2;position:relative}
  #board{
    display:grid;gap:5px;padding:12px;border-radius:30px;touch-action:none;position:relative;
    background:linear-gradient(180deg,rgba(18,70,140,.88),rgba(12,50,110,.92));
    border:9px solid #6FD4FF;
    box-shadow:0 0 0 3px #2E9BE6,0 0 0 6px rgba(200,245,255,.9),0 16px 34px rgba(0,30,80,.55),
      inset 0 0 0 3px rgba(255,255,255,.35),inset 0 6px 14px rgba(0,0,0,.45)}
  #board::before{content:"";position:absolute;inset:-14px;border-radius:38px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 18%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:8px}
  .jb{position:absolute;border-radius:50%;pointer-events:none;z-index:4;
    background:radial-gradient(circle at 32% 30%,#fff 0 18%,rgba(190,240,255,.85) 30%,rgba(110,210,255,.55) 70%);
    box-shadow:0 2px 4px rgba(0,40,90,.3)}
  .cell{position:relative;border-radius:20%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .15s;
    background:linear-gradient(160deg,rgba(150,200,255,.30),rgba(90,140,220,.16));
    box-shadow:inset 0 2px 2px rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,30,.25)}
  .cell.sel{transform:scale(1.15);z-index:3;background:rgba(255,255,255,.5);
    box-shadow:0 0 0 3px #FFD94D,0 0 20px #FFD94D,inset 0 2px 3px rgba(255,255,255,.4)}
  .fish{width:90%;height:90%;animation:bob 3s ease-in-out infinite;object-fit:contain;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  .cell.hint{animation:hint .9s infinite}
  @keyframes hint{50%{transform:scale(.82);filter:brightness(1.4)}}
  .cell.matched{animation:pop .32s forwards}
  @keyframes pop{35%{transform:scale(1.4) rotate(15deg)}100%{transform:scale(0) rotate(-15deg)}}
  .cell.born{animation:born .3s cubic-bezier(.3,1.5,.5,1)}
  @keyframes born{0%{transform:scale(0) rotate(90deg)}100%{transform:scale(1)}}
  .cell.sp .fish{animation:spglow 1.6s ease-in-out infinite}
  @keyframes spglow{0%,100%{filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
    50%{filter:drop-shadow(0 0 10px #FFD94D) drop-shadow(0 3px 3px rgba(0,0,0,.35))}}
  .cell.sp-b{animation:bombpulse 1.2s infinite}
  @keyframes bombpulse{50%{box-shadow:0 0 0 3px #FFD94D,0 0 18px #FFD94D,inset 0 2px 3px rgba(255,255,255,.35)}}
  .stripes{position:absolute;inset:12%;pointer-events:none;opacity:.9}
  .stripes.h{background:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 4px,transparent 4px 9px)}
  .stripes.v{background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 4px,transparent 4px 9px)}
  .wrapring{position:absolute;inset:6%;border:3px dashed #FFD94D;border-radius:50%;pointer-events:none;
    animation:spinring 6s linear infinite}
  @keyframes spinring{to{transform:rotate(360deg)}}
  .bombglow{position:absolute;inset:8%;border-radius:50%;pointer-events:none;
    background:conic-gradient(#FF6B9D,#FFD94D,#4FCB71,#4FB3FF,#B678FF,#FF6B9D);
    animation:spinring 3s linear infinite;filter:blur(2px);opacity:.85;
    -webkit-mask:radial-gradient(circle,transparent 55%,#000 58%);mask:radial-gradient(circle,transparent 55%,#000 58%)}

  /* scratch marks */
  .scratch{position:absolute;inset:-8%;pointer-events:none;z-index:5}
  .scratch i{position:absolute;left:10%;width:80%;height:7%;border-radius:4px;
    background:linear-gradient(90deg,transparent,#fff 15%,#FFD94D 50%,#fff 85%,transparent);
    box-shadow:0 0 8px #fff;transform:rotate(-42deg);opacity:0;animation:claw .26s forwards}
  .scratch i:nth-child(1){top:30%}
  .scratch i:nth-child(2){top:48%;animation-delay:.05s}
  .scratch i:nth-child(3){top:66%;animation-delay:.1s}
  @keyframes claw{0%{opacity:0;transform:rotate(-42deg) scaleX(.1)}35%{opacity:1}
    100%{opacity:0;transform:rotate(-42deg) scaleX(1.3)}}

  .beam{position:fixed;z-index:58;pointer-events:none;border-radius:8px;opacity:0;
    background:linear-gradient(90deg,transparent,#fff 15%,#FFD94D 50%,#fff 85%,transparent);
    box-shadow:0 0 14px #FFD94D;animation:beamfx .4s forwards}
  .beam.v{background:linear-gradient(180deg,transparent,#fff 15%,#FFD94D 50%,#fff 85%,transparent)}
  @keyframes beamfx{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

  #paw{position:fixed;z-index:60;pointer-events:none;opacity:0;width:120px;height:120px}
  #paw img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  #paw.go{animation:pawfly .5s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes pawfly{
    0%{opacity:0;transform:translate(0,0) rotate(-35deg) scale(.5)}
    12%{opacity:1}
    85%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(20deg) scale(1.25)}}
  #slash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
  #slash.go{animation:slashfade .55s forwards}
  #slash i{position:absolute;height:12px;width:130%;left:-15%;border-radius:6px;
    background:linear-gradient(90deg,transparent,#fff 10%,#FFD94D 90%,transparent);
    box-shadow:0 0 8px #fff}
  @keyframes slashfade{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

  .float{position:fixed;z-index:70;font-weight:900;font-size:24px;color:#FFD94D;pointer-events:none;
    font-family:"Arial Black",Arial,sans-serif;
    text-shadow:0 0 14px rgba(255,182,61,.9),0 3px 4px rgba(0,0,0,.6);animation:floatup 1.1s forwards}
  @keyframes floatup{to{transform:translateY(-80px) scale(1.15);opacity:0}}
  #combo{position:fixed;top:36%;left:50%;transform:translateX(-50%);z-index:70;pointer-events:none;
    font-size:36px;font-weight:900;color:#fff;opacity:0;letter-spacing:1px;text-align:center;
    font-family:"Arial Black",Arial,sans-serif;
    text-shadow:0 0 20px rgba(255,107,157,.9),0 4px 0 #B02858,0 6px 8px rgba(0,0,0,.5)}
  #combo.go{animation:combo 1s forwards}
  @keyframes combo{15%{opacity:1;transform:translateX(-50%) scale(1.3)}75%{opacity:1}
    100%{opacity:0;transform:translateX(-50%) scale(.9) translateY(-30px)}}
  .particle{position:fixed;border-radius:50%;z-index:65;pointer-events:none;animation:part .7s forwards}
  @keyframes part{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;
    background:rgba(4,30,55,.65);backdrop-filter:blur(7px)}
  #msg .card{background:linear-gradient(165deg,#1B7FC4,#0B4F8A);
    border:3px solid rgba(255,255,255,.6);
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.3);
    border-radius:28px;padding:28px 26px;text-align:center;max-width:340px;width:86vw}
  #msg .big{width:100px;height:100px;margin:0 auto 8px;border-radius:50%;overflow:hidden;
    border:3px solid #fff;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.35)}
  #msg .big img{width:100%;height:100%;object-fit:cover}
  #msg .mlogo{width:78%;margin:-70px auto 6px;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
  #msg .mstars{font-size:36px;letter-spacing:8px;margin-bottom:4px}
  #msg h2{color:#FFD94D;margin-bottom:8px;font-size:26px;letter-spacing:1px;
    font-family:"Arial Black",Arial,sans-serif;text-shadow:0 3px 0 #06345E}
  #msg p{opacity:.92;font-size:14px;margin-bottom:20px;line-height:1.5}
  #msg button{background:linear-gradient(180deg,#FFE86B,#FFB63D);border:3px solid #fff;
    color:#7A4A00;font-weight:900;font-size:17px;padding:14px 36px;border-radius:18px;cursor:pointer;
    letter-spacing:.5px;box-shadow:0 5px 0 #B87A00,0 8px 14px rgba(0,0,0,.35)}
  #msg button:active{transform:scale(.94)}
</style>
</head>
<body>

<div id="hud">
  <div id="cat"><img src="assets/cat.png" alt=""></div>
  <div id="title"><img src="assets/logo.png" alt="Fishy Crush"></div>
  <div id="moves"><b id="mv">25</b><span>movs</span></div>
</div>
<div id="scorebar">
  <div id="progress"><div id="fill"></div>
    <div id="ptext"><span id="sc">0</span>/<span id="tg">500</span>&nbsp;·&nbsp;NIVEL&nbsp;<span id="lv">1</span></div>
    <div id="stars"><img class="star" id="st0" src="assets/star.png" alt=""><img class="star" id="st1" src="assets/star.png" alt=""><img class="star" id="st2" src="assets/star.png" alt=""></div>
  </div>
</div>
<div id="stage"><div id="board"></div></div>

<div id="paw"><img src="assets/paw.png" alt=""></div>
<div id="slash"><i></i><i></i><i></i></div>
<div id="combo"></div>
<div id="msg"><div class="card">
  <img class="mlogo" src="assets/logo.png" alt=""><div class="big"><img src="assets/cat.png" alt=""></div>
  <div class="mstars" id="msg-stars"></div>
  <h2 id="msg-title">Fishy Crush</h2>
  <p id="msg-text">Ayudá al gato a pescar: deslizá un pescadito sobre su vecino para juntar 3 o más iguales. 4 seguidos = pez rayado, en L/T = pez bomba, 5 seguidos = pez arcoíris. ¡La garra hace el resto!</p>
  <button id="msg-btn">¡A pescar!</button>
</div></div>

<script>
const COLS=8, ROWS=8;
const IMGS=['fish1.png','fish2.png','fish3.png','fish4.png','fish5.png','fish6.png','fish7.png'];
const PCOLORS=['#FF8A3D','#2F6BFF','#FFD94D','#D27BFF','#FF5A3D','#2FD39A','#F5D020'];
let grid=[], sel=null, score=0, moves=25, level=1, target=500, busy=false, cell=44;
const board=document.getElementById('board');
const NCOLORS=()=>level<3?5:level<6?6:7;

let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='sine',vol=.15,slide=0){try{const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(f+slide,a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur);}catch(e){}}
const sfx={
  swap(){tone(300,.12,'triangle',.12,180)},
  pop(){tone(600,.1,'square',.1,300)},
  special(){tone(440,.2,'triangle',.18,700)},
  combo(n){tone(500+n*80,.15,'triangle',.16,400);setTimeout(()=>tone(700+n*80,.2,'triangle',.14,500),70)},
  bad(){tone(180,.15,'sawtooth',.08,-60)},
  beam(){tone(200,.3,'sawtooth',.1,900)},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*110))},
  lose(){tone(300,.5,'sine',.14,-180)},
};

function size(){const w=Math.min(innerWidth-20,500),h=innerHeight*.58;
  cell=Math.floor(Math.min((w-42-(COLS-1)*5)/COLS,(h-42-(ROWS-1)*5)/ROWS));
  board.style.gridTemplateColumns=`repeat(${COLS},${cell}px)`;}
addEventListener('resize',()=>{size();render();jelly()});
function jelly(){
  document.querySelectorAll('.jb').forEach(e=>e.remove());
  const st=document.getElementById('stage'),sr=st.getBoundingClientRect(),br=board.getBoundingClientRect();
  const pts=[[.08,0,20],[.2,0,10],[.62,0,26],[.8,0,12],[1,.12,22],[1,.5,12],[1,.86,18],[.9,1,14],[.55,1,24],[.3,1,10],[0,.95,16],[0,.6,22],[0,.25,12]];
  for(const[x,y,d]of pts){const b=document.createElement('div');b.className='jb';
    b.style.width=b.style.height=d+'px';
    b.style.left=(br.left-sr.left+x*br.width-d/2+(x===0?-6:x===1?6:0))+'px';
    b.style.top=(br.top-sr.top+y*br.height-d/2+(y===0?-6:y===1?6:0))+'px';st.appendChild(b);}
}

function mk(t,s){return {t,s:s||null}}
function rnd(){return mk(Math.floor(Math.random()*NCOLORS()))}
function init(){grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];
    for(let c=0;c<COLS;c++){let v;do{v=rnd()}while(
      (c>=2&&grid[r][c-1].t===v.t&&grid[r][c-2].t===v.t)||
      (r>=2&&grid[r-1][c].t===v.t&&grid[r-2][c].t===v.t));grid[r][c]=v;}}}

function hud(){
  document.getElementById('sc').textContent=score;
  document.getElementById('tg').textContent=target;
  document.getElementById('lv').textContent=level;
  document.getElementById('mv').textContent=moves;
  const pct=score/target;
  document.getElementById('fill').style.width=Math.min(100,pct*100)+'%';
  document.getElementById('st0').classList.toggle('on',pct>=.62);
  document.getElementById('st1').classList.toggle('on',pct>=.8);
  document.getElementById('st2').classList.toggle('on',pct>=1);
}

function fishHtml(v){
  let extra='';
  if(v.s==='h')extra='<div class="stripes h"></div>';
  if(v.s==='v')extra='<div class="stripes v"></div>';
  if(v.s==='w')extra='<div class="wrapring"></div>';
  if(v.s==='b')extra='<div class="bombglow"></div>';
  return `<img class="fish" src="assets/${IMGS[v.t]}" draggable="false">`+extra;
}
function render(){
  board.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=document.createElement('div');d.className='cell';
    d.dataset.r=r;d.dataset.c=c;d.style.width=d.style.height=cell+'px';
    const v=grid[r][c];
    if(v!=null){d.innerHTML=fishHtml(v);
      if(v.s)d.classList.add(v.s==='b'?'sp-b':'sp');}
    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add('sel');
    board.appendChild(d);
  }
  hud();
}

let down=null,sx=0,sy=0;
board.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.cell');if(!t)return;
  down=[+t.dataset.r,+t.dataset.c];sx=e.clientX;sy=e.clientY;
});
board.addEventListener('pointerup',e=>{
  if(!down)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>18||Math.abs(dy)>18){
    let[r,c]=down,tr=r,tc=c;
    if(Math.abs(dx)>Math.abs(dy))tc+=dx>0?1:-1;else tr+=dy>0?1:-1;
    if(tr>=0&&tr<ROWS&&tc>=0&&tc<COLS)trySwap([r,c],[tr,tc]);
  }else{
    const r=down[0],c=down[1];
    if(!sel){sel=[r,c];render();}
    else if(sel[0]===r&&sel[1]===c){sel=null;render();}
    else if(Math.abs(sel[0]-r)+Math.abs(sel[1]-c)===1)trySwap(sel,[r,c]);
    else{sel=[r,c];render();}
  }
  down=null;
});
board.addEventListener('pointercancel',()=>down=null);

function trySwap(a,b){
  if(busy)return;
  const[r1,c1]=a,[r2,c2]=b;
  const va=grid[r1][c1],vb=grid[r2][c2];
  if(va.s||vb.s){
    moves--;sel=null;sfx.swap();pawSwipe(a,b);
    const rem=new Set([r1+','+c1,r2+','+c2]);
    if(va.s==='b'){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
        if(grid[r][c].t===vb.t)rem.add(r+','+c);}
    if(vb.s==='b'){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
        if(grid[r][c].t===va.t)rem.add(r+','+c);}
    render();resolve(rem,null);return;
  }
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
  sel=null;
  const m=findMatches();
  if(m.cells.size===0){
    [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
    sfx.bad();render();
    board.classList.add('shake');setTimeout(()=>board.classList.remove('shake'),350);
    return;
  }
  sfx.swap();moves--;
  pawSwipe(a,b);
  render();
  resolve(m.cells,m.creates);
}

function findMatches(){
  const cells=new Set(), creates=[];
  const runs=[];
  for(let r=0;r<ROWS;r++){let run=[r+',0'];
    for(let c=1;c<=COLS;c++){
      if(c<COLS&&grid[r][c]&&grid[r][c-1]&&grid[r][c].t===grid[r][c-1].t)run.push(r+','+c);
      else{if(run.length>=3)runs.push({cells:run,dir:'h'});run=[r+','+c];}}}
  for(let c=0;c<COLS;c++){let run=['0,'+c];
    for(let r=1;r<=ROWS;r++){
      if(r<ROWS&&grid[r][c]&&grid[r-1][c]&&grid[r][c].t===grid[r-1][c].t)run.push(r+','+c);
      else{if(run.length>=3)runs.push({cells:run,dir:'v'});run=[r+','+c];}}}
  const inRun={};
  for(const run of runs){
    for(const k of run.cells){cells.add(k);inRun[k]=(inRun[k]||[]).concat(run.dir);}
    let spot=run.cells[Math.floor(run.cells.length/2)];
    if(run.cells.length>=5)creates.push({at:spot,s:'b'});
    else if(run.cells.length===4)creates.push({at:spot,s:run.dir==='h'?'h':'v'});
  }
  for(const k of cells){
    const d=inRun[k];
    if(d&&d.includes('h')&&d.includes('v'))creates.push({at:k,s:'w'});
  }
  return {cells,creates};
}

function pawSwipe(a,b){
  const cat=document.getElementById('cat');
  cat.classList.remove('swiping');void cat.offsetWidth;cat.classList.add('swiping');
  const paw=document.getElementById('paw');
  const ra=board.children[a[0]*COLS+a[1]].getBoundingClientRect();
  const rb=board.children[b[0]*COLS+b[1]].getBoundingClientRect();
  paw.style.left=(ra.left-40)+'px';paw.style.top=(ra.top-45)+'px';
  paw.style.setProperty('--dx',(rb.left-ra.left+80)+'px');
  paw.style.setProperty('--dy',(rb.top-ra.top+80)+'px');
  paw.classList.remove('go');void paw.offsetWidth;paw.classList.add('go');
}
function beam(r,c,s){
  const b=document.createElement('div');
  b.className='beam'+(s==='v'?' v':'');
  const br=board.getBoundingClientRect();
  const cr=board.children[r*COLS+c].getBoundingClientRect();
  if(s==='h'){b.style.left=br.left+'px';b.style.top=(cr.top+cr.height/2-6)+'px';
    b.style.width=br.width+'px';b.style.height='12px';}
  else{b.style.top=br.top+'px';b.style.left=(cr.left+cr.width/2-6)+'px';
    b.style.height=br.height+'px';b.style.width='12px';}
  document.body.appendChild(b);setTimeout(()=>b.remove(),450);
}
function bigSlash(){
  const s=document.getElementById('slash');
  const is=s.querySelectorAll('i');
  const y=board.getBoundingClientRect().top+board.offsetHeight/2;
  is.forEach((el,i)=>{el.style.top=(y-45+i*45)+'px';el.style.transform=`rotate(${-18-i*4}deg)`;});
  s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
}
function floatText(txt,x,y){
  const f=document.createElement('div');f.className='float';
  f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
}
function comboBanner(txt){
  const c=document.getElementById('combo');
  c.textContent=txt;
  c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
}
function particles(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='particle';
    const s=4+Math.random()*7;
    p.style.width=p.style.height=s+'px';
    p.style.left=x+'px';p.style.top=y+'px';
    p.style.background=color;
    p.style.boxShadow=`0 0 ${s}px ${color}`;
    const ang=Math.random()*Math.PI*2,d=30+Math.random()*60;
    p.style.setProperty('--dx',Math.cos(ang)*d+'px');
    p.style.setProperty('--dy',(Math.sin(ang)*d-30)+'px');
    document.body.appendChild(p);setTimeout(()=>p.remove(),750);
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function expand(rem,creates){
  const keep=new Set((creates||[]).map(x=>x.at));
  let changed=true;
  while(changed){changed=false;
    for(const k of [...rem]){
      if(keep.has(k))continue;
      const[r,c]=k.split(',').map(Number);
      const v=grid[r]&&grid[r][c];
      if(!v||!v.s)continue;
      if(v.s==='h'||v.s==='v'){
        beam(r,c,v.s);sfx.beam();
        for(let i=0;i<(v.s==='h'?COLS:ROWS);i++){
          const kk=v.s==='h'?r+','+i:i+','+c;
          if(!rem.has(kk)){rem.add(kk);changed=true;}
        }
      }else if(v.s==='w'){
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=r+dr,cc=c+dc;
          if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS){
            const kk=rr+','+cc;
            if(!rem.has(kk)){rem.add(kk);changed=true;}
          }}
      }else if(v.s==='b'){
        const t=v.t;
        for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++){
          if(grid[rr][cc]&&grid[rr][cc].t===t){
            const kk=rr+','+cc;
            if(!rem.has(kk)){rem.add(kk);changed=true;}
          }}
      }
    }
  }
  return rem;
}

async function resolve(firstCells,creates){
  busy=true;
  let m=firstCells,cr=creates||[],combo=0;
  while(m.size){
    combo++;
    m=expand(m,cr);
    const pts=m.size*10*combo;
    score+=pts;
    const first=[...m][0].split(',').map(Number);
    const el0=board.children[first[0]*COLS+first[1]];
    if(el0){const rc=el0.getBoundingClientRect();floatText(`+${pts}`,rc.left,rc.top-14);}
    if(combo>1){comboBanner(`¡COMBO x${combo}!`);sfx.combo(combo);bigSlash();
      document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),350);}
    else if(combo===1&&cr.length){comboBanner('¡PEZ ESPECIAL!');sfx.special();}
    else sfx.pop();
    for(const k of m){
      const[r,c]=k.split(',').map(Number);
      const el=board.children[r*COLS+c];
      if(el){
        const rc=el.getBoundingClientRect();
        const v=grid[r][c];
        particles(rc.left+rc.width/2,rc.top+rc.height/2,v?PCOLORS[v.t]:'#fff',v&&v.s?16:8);
        const s=document.createElement('div');s.className='scratch';
        s.innerHTML='<i></i><i></i><i></i>';el.appendChild(s);
        setTimeout(()=>el.classList.add('matched'),130);
      }
    }
    await sleep(330);
    for(const k of m){const[r,c]=k.split(',').map(Number);grid[r][c]=null;}
    for(const x of cr){
      const[r,c]=x.at.split(',').map(Number);
      if(grid[r][c]===null)grid[r][c]=mk(Math.floor(Math.random()*NCOLORS()),x.s);
    }
    cr=[];
    for(let c=0;c<COLS;c++){let w=ROWS-1;
      for(let r=ROWS-1;r>=0;r--)if(grid[r][c]!=null){grid[w][c]=grid[r][c];w--;}
      for(let r=w;r>=0;r--)grid[r][c]=rnd();}
    render();
    await sleep(240);
    const f=findMatches();m=f.cells;cr=f.creates;
  }
  busy=false;
  render();
  if(score>=target)sugarCrush();
  else if(moves<=0)end(false);
  else showHint();
}

async function sugarCrush(){
  busy=true;
  comboBanner('¡SUGAR CRUSH!');
  sfx.special();
  await sleep(600);
  while(moves>0){
    moves--;
    const r=Math.floor(Math.random()*ROWS), c=Math.floor(Math.random()*COLS);
    grid[r][c]=mk(Math.floor(Math.random()*NCOLORS()),Math.random()<.5?'h':'v');
    render();
    const el=board.children[r*COLS+c];
    el&&el.classList.add('born');
    sfx.swap();
    await sleep(160);
    let m=new Set([r+','+c]);
    m=expand(m,[]);
    score+=m.size*15;
    for(const k of m){
      const[rr,cc]=k.split(',').map(Number);
      const el=board.children[rr*COLS+cc];
      if(el){const rc=el.getBoundingClientRect();
        particles(rc.left+rc.width/2,rc.top+rc.height/2,'#fff',6);
        el.classList.add('matched');}
    }
    await sleep(260);
    for(const k of m){const[rr,cc]=k.split(',').map(Number);grid[rr][cc]=null;}
    for(let c=0;c<COLS;c++){let w=ROWS-1;
      for(let r2=ROWS-1;r2>=0;r2--)if(grid[r2][c]!=null){grid[w][c]=grid[r2][c];w--;}
      for(let r2=w;r2>=0;r2--)grid[r2][c]=rnd();}
    render();
    await sleep(200);
  }
  busy=false;
  end(true);
}

function showHint(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const[dr,dc]of[[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;
      if(grid[r][c].s||grid[r2][c2].s){board.children[r*COLS+c]?.classList.add('hint');
        board.children[r2*COLS+c2]?.classList.add('hint');return;}
      [grid[r][c],grid[r2][c2]]=[grid[r2][c2],grid[r][c]];
      const ok=findMatches().cells.size>0;
      [grid[r][c],grid[r2][c2]]=[grid[r2][c2],grid[r][c]];
      if(ok){board.children[r*COLS+c]?.classList.add('hint');
        board.children[r2*COLS+c2]?.classList.add('hint');return;}
    }
  }
}

function end(win){
  const m=document.getElementById('msg');
  const pct=score/target;
  const stars=win?(pct>=2?3:pct>=1.5?2:1):0;
  document.getElementById('msg-stars').textContent=win?'⭐'.repeat(stars)+'☆'.repeat(3-stars):'';
  document.getElementById('msg-title').textContent=win?'¡Nivel superado!':'Sin movimientos';
  document.getElementById('msg-text').textContent=win?
    `¡El gato cenó como un rey! ${score} puntos. El próximo nivel pide más.`:
    `Llegaste a ${score} puntos. El gato sigue con hambre…`;
  document.getElementById('msg-btn').textContent=win?'Siguiente nivel':'Reintentar';
  m.style.display='flex';
  win?sfx.win():sfx.lose();
  document.getElementById('msg-btn').onclick=()=>{
    if(win){level++;target=500*level;}else{level=1;target=500;score=0;}
    moves=25;m.style.display='none';init();render();
  };
}
document.getElementById('msg-btn').onclick=()=>{
  ac();
  document.getElementById('msg').style.display='none';init();render();
};
/* bubbles */
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bubble';
  const s=6+Math.random()*28;b.style.width=b.style.height=s+'px';
  b.style.left=Math.random()*100+'vw';
  b.style.animationDuration=(7+Math.random()*10)+'s';
  b.style.animationDelay=-Math.random()*12+'s';document.body.appendChild(b);}
size();init();render();jelly();
document.getElementById('msg').style.display='flex';
</script>
